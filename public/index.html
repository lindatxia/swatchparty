<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Swatch Party</title>
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/pdf-lib.js"></script>
  <script type="module" src="/studio.js"></script>
</head>
<body>
  <main>
    <header><h1>swatch party</h1></header>
    <p id="entry" role="status">Opening the workspace…</p>
    <div id="workspace" hidden>
      <nav class="toolbar" aria-label="Workspace controls">
        <div class="palette-tools">
          <div class="palette-picker">
            <span id="palette-dots" class="palette-dots" aria-hidden="true"></span>
            <select id="palette" aria-label="Palette or saved lineup"></select>
          </div>
          <div class="save-meta">
            <span role="status"><span id="save-status"></span>
              <span class="saved-time"><span id="saved-check" aria-hidden="true" hidden>✓</span><time id="saved-at"></time></span>
            </span>
            <button id="retry" class="text-button" hidden>Retry</button>
          </div>
        </div>
        <div class="actions toolbar-actions">
          <div class="split-save">
            <button id="save-current" type="button">Save</button>
            <details id="save-actions" class="more-actions">
              <summary aria-label="Save options" title="Save options"><span class="save-chevron" aria-hidden="true"></span></summary>
              <div class="more-panel">
                <button id="save-lineup" type="button"><span aria-hidden="true">⊕</span> Save as new palette</button>
                <button id="discard-lineup" type="button"><span aria-hidden="true">↶</span> Discard changes</button>
              </div>
            </details>
          </div>
          <details id="more-actions" class="more-actions">
            <summary aria-label="More actions" title="More actions"><span aria-hidden="true">⋮</span></summary>
            <div class="more-panel">
              <button id="randomize-order" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c1.4 0 2.6-.9 3.7-2.3m4.6-7.4C15.4 6.9 16.6 6 18 6h3m-4-4 4 4-4 4"/></svg>
                <span>Randomize order</span>
              </button>
              <button id="backdrop" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m3 17 5-5 4 4 4-5 5 6"/></svg>
                <span>Set backdrop</span>
              </button>
              <button id="plain" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
                <span>Plain background</span>
              </button>
              <button id="share" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M7 10H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-2"/></svg>
                <span>Share</span>
              </button>
              <button id="download" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/></svg>
                <span>Download PDF</span>
              </button>
              <button id="final-lineup" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
                <span>Mark final</span>
              </button>
              <button id="delete-lineup" type="button" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>
                <span>Delete lineup</span>
              </button>
            </div>
          </details>
          <input id="backdrop-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
        </div>
      </nav>
      <p id="notice" role="status" hidden></p>
      <div class="lineup-scroll" tabindex="0" aria-label="Bridesmaid lineup">
        <section id="lineup" aria-label="Dress comparison"></section>
      </div>
    </div>
  </main>
  <div id="workspace-toast" class="toast"><span id="toast-message" role="status" aria-atomic="true"></span><button id="toast-undo" type="button" hidden>Undo</button></div>
  <dialog id="dress-dialog">
    <form id="dress-form">
      <h2 id="dress-heading">Add a dress</h2>
      <div class="form-row">
        <label>Style <input name="style" required maxlength="80"></label>
        <div class="dress-color-field">
          <label for="dress-color">Color</label>
          <select id="dress-color" name="color" required></select>
        </div>
      </div>
      <label>Dress URL <input name="url" autofocus type="url" required placeholder="Paste an Azazie or Birdy Grey dress link"></label>
      <label>Transparent cutout (optional) <input name="cutout" type="file" accept="image/png,image/webp"></label>
      <a id="dress-retailer" target="_blank" rel="noopener noreferrer" hidden>View product</a>
      <p id="dress-message" role="status"></p>
      <div class="actions"><button id="cancel-dress" type="button">Cancel</button><button type="submit">Save dress</button></div>
    </form>
  </dialog>
  <dialog id="color-dialog" aria-labelledby="color-heading">
    <form id="color-form">
      <h2 id="color-heading">Add a color</h2>
      <label>Dress link for the new color <input name="url" type="url" required maxlength="1200" placeholder="Paste a link to the same dress in another color"></label>
      <p id="color-message" role="status"></p>
      <div class="actions">
        <button id="cancel-color" type="button">Cancel</button>
        <button type="submit">Add color</button>
      </div>
    </form>
  </dialog>
  <dialog id="name-dialog">
    <form id="name-form">
      <h2>Save lineup</h2>
      <label>Lineup name <input name="name" required maxlength="80"></label>
      <div class="actions"><button id="cancel-name" type="button">Cancel</button><button type="submit">Save lineup</button></div>
    </form>
  </dialog>
</body>
</html>
