<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Compare bridesmaid dress styles and wedding color palettes.">
  <title>Swatch Party</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="studio.js"></script>
</head>
<body>
  <main id="studio">
    <header>
      <h1>Swatch Party</h1>
      <div class="actions">
        <button id="reset">Reset to preferences</button>
        <button id="share">Copy lineup link</button>
      </div>
    </header>

    <div class="controls">
      <div class="control-row">
        <h2 id="presets-label">Starting palettes</h2>
        <div id="presets" class="buttons" role="group" aria-labelledby="presets-label"></div>
      </div>
      <div class="control-row">
        <h2 id="families-label">Color families</h2>
        <div id="families" class="buttons" role="group" aria-labelledby="families-label"></div>
      </div>
    </div>

    <div class="palette-summary">
      <div id="strip" class="strip" aria-hidden="true"></div>
      <p id="summary" aria-live="polite"></p>
    </div>
    <p id="share-status" role="status" hidden></p>
    <section id="lineup" class="lineup" aria-label="Bridesmaid lineup"></section>
    <p class="fine">Recolored previews and swatches are approximate. Check Azazie for style and color availability.</p>

    <details id="inspiration">
      <summary>Inspiration from your slides</summary>
      <div class="references">
        <figure><img src="mauve.jpg" alt="Bridesmaid dresses in pink, mauve, and plum" loading="lazy"><figcaption>Tonal mauve</figcaption></figure>
        <figure><img src="garden.jpg" alt="Garden mood board with muted green, blush, and brown dresses" loading="lazy"><figcaption>Garden mix</figcaption></figure>
      </div>
    </details>
  </main>
</body>
</html>
